<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bill Splitter</title>
    <link rel="stylesheet" href="bill_cal.css">
</head>
<body>
    <div class="container">
        <h1>Bill Splitter</h1>

        <label>Bill Amount ($)</label>
        <input type="number" id="bill" placeholder="Enter bill amount">

        <label>Tip Percentage</label>
        <select id="tip">
            <option value="5">5%</option>
            <option value="10">10%</option>
            <option value="15">15%</option>
            <option value="20">20%</option>
            <option value="25">25%</option>
        </select>

        <label>Number of People</label>
        <input type="number" id="people" placeholder="Enter people">

        <div class="buttons">
            <button onclick="calculate()">Calculate</button>
            <button onclick="resetFeilds()">Reset</button>
        </div>

        <div class="result">
            <h3>Tip Amount: <span id="tipAmount">$0.00</span></h3>
            <h3>Total Bill: <span id="total">$0.00</span></h3>
            <h3> Per Person:<span id="perPerson">$0.00</span></h3>
        </div>
    </div>

    <script src="bill_calc.js"></script>
    
</body>
</html>
